name: Publication guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check published research
        run: python scripts/check_publication_safety.py
      - name: Prepare publication staging copy
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -a research-program "$staging/research-program"
          python scripts/prepare_publication.py --staging-root "$staging/research-program"
          python scripts/check_publication_safety.py --root "$staging/research-program"

