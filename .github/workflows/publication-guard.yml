name: Publication guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check published research
        run: python scripts/check_publication_safety.py

